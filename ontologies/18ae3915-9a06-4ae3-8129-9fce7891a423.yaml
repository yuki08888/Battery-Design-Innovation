- className: Package
  id: 724d060b-5ebe-4882-91b1-8d78fa9b3328
  name: Property 共通規約
  isReferenceModel: false
  conventions:
    naming:
      pattern: インターフェース (port) は『信号名 + 方向』または『接続先+データ種別』。Part は型ブロック名と整合させる。先頭は小文字 (camelCase) が推奨。
      examples:
        good:
        - transactionCsv_in
        - importResult_out
        - apiConnectionPort
      severity: warning
    rules:
    - id: RUL_d0fe
      title: API連携および外部通信時のセキュリティ暗号化規約
      statement: 既存社内基幹システムなどの外部API接続やデータ通信を伴う接続ポート/インターフェースは、必ず暗号化（HTTPS等）制約要件（BR-05/セキュリティポリシー）を satisfy すること。
      severity: error
    - id: RUL_5491
      title: インターフェースは方向と型を必ず指定する
      statement: Property (port/part) として表現するインターフェースは direction (in/out/inout) と type を必ず設定する。
      severity: warning
