SchemaVersion: 3
OntologyName: SysMLオントロジー
Version: 3.0.0
Domain: Battery Design Innovationプロジェクトにおけるビジネス要求（取引データの自動化、承認ワークフロー等）およびMBSEの汎用的なモデリング概念・関係・命名規則・ルールを定義する統合オントロジー。
Elements:
- className: Requirement
  id: 17326236-31b6-4e4b-8c4c-fe261e645d25
  name: 要求
  description: システムが満たすべき機能要求・性能要求・制約・非機能要求 (品質要求)。ビジネス要求書等から導出され、検証可能 (testable) な単一要求として記述する。
  text: システムが満たすべき機能要求・性能要求・制約・非機能要求 (品質要求)。ビジネス要求書等から導出され、検証可能 (testable) な単一要求として記述する。
  stereotypes: []
  conventions:
    naming:
      pattern: 検証可能な要求文。末尾は『〜すること』『〜できること』『〜以下とすること』等の断定形で統一する。ビジネス要求ID（BR-XXなど）をプレフィックスに含める。
      examples:
        good:
        - BR-01 取引データをCSVのドラッグ＆ドロップにより一括登録できること
        - BR-02 CSVアップロード時に必須項目や型エラーをリアルタイムで検知すること
        - BR-05 データ通信はすべてHTTPSにより暗号化すること
      severity: warning
    rules:
    - id: RUL_da33
      title: ビジネス要件のフェージング（スコープ外）制御
      statement: AIエラー予測、モバイルネイティブアプリ等の将来展望項目（スコープ外）は、今回の開発フェーズパッケージ（フェーズ1）からは除外し、バックログまたは将来フェーズパッケージ（フェーズ2）に明確に隔離してモデリングすること。
      severity: warning
    - id: RUL_f0a7
      title: モデルレビューで整合性を確認する
      statement: 要求-設計-振る舞い-検証の各レイヤ間で、未接続要素・矛盾・重複が無いか定期的に確認する。生成直後と統合直後は必須。
      severity: info
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_ac8b
      title: 要求は必ずテストケースで検証する
      statement: priority=must/Must の要求は少なくとも 1 つの TestCase と verify 関係で接続する。verify の無い must 要求はカバレッジ不足。
      severity: warning
    - id: RUL_f793
      title: 要求は設計要素または振る舞いへ追跡可能にする
      statement: 主要要求は satisfy / refine / trace の少なくとも一つで下流成果物 (Block, Activity, UseCase) と接続する。孤立した要求を残さない。
      severity: warning
    - id: RUL_3374
      title: 要求には優先度と検証方法を必ず付与する
      statement: priority (must/should/may、またはMust/Want) と verificationMethod を欠落させない。
      severity: info
    - id: RUL_330d
      title: 要求は検証可能な単一文で記述する
      statement: Requirement の text は『〜すること』形式の単一要求とし、'適切な'/'十分な'/'なるべく' 等の曖昧語を使わない。複合要求は分割する。
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_005
- className: UseCase
  id: 04c27c67-fbc8-4210-8fc2-917fde2c8ecd
  name: ユースケース
  description: アクター視点でシステムが提供する価値ある一連の振る舞い。ビジネス目標や自動化シナリオを表現する。
  messageOrder: []
  stereotypes: []
  conventions:
    naming:
      pattern: アクター視点の価値表現。動詞句または短文。システム内部の処理ではなくアクターが得る成果を表す。
      examples:
        good:
        - 取引データをインポートする
        - 承認進捗を確認する
        - 多段階承認を実行する
        - 処理状況をダッシュボードで監視する
      severity: warning
    rules:
    - id: RUL_f0a7
      title: モデルレビューで整合性を確認する
      statement: 要求-設計-振る舞い-検証の各レイヤ間で、未接続要素・矛盾・重複が無いか定期的に確認する。生成直後と統合直後は必須。
      severity: info
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_9547
      title: ユースケースは Activity で詳細化する
      statement: 主要 UseCase は refine 関係で Activity と接続し、シナリオを詳細化する。テキスト記述のみのユースケースは検証困難。
      severity: info
    - id: RUL_c34f
      title: ユースケースは最低 1 つのアクターを持つ
      statement: UseCase は association で最低 1 アクターと接続。アクター無しのユースケースはシステム外部からの起動契機が不明。
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_006
- className: Actor
  id: 508936b5-ac44-4b9e-9b0d-35380c85484e
  name: アクター
  description: システムと相互作用する外部主体 (現場オペレーター、管理者、外部基幹システムなど)。
  stereotypes: []
  conventions:
    naming:
      pattern: 外部主体の役割名。人間アクターは肩書きで、外部システムはシステム名+役割で命名。
      examples:
        good:
        - 現場オペレーター
        - 管理者
        - 既存社内基幹システム
      severity: warning
    rules:
    - id: RUL_c34f
      title: ユースケースは最低 1 つのアクターを持つ
      statement: UseCase は association で最低 1 アクターと接続。アクター無しのユースケースはシステム外部からの起動契機が不明。
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_007
- className: Activity
  id: 34097f46-1dbd-44ac-afe2-3d1ba5de2466
  name: アクティビティ
  description: システムまたはサブシステムが実行する処理の流れ (インポート自動化、承認ワークフロー、リアルタイムエラーチェックなど)。
  stereotypes: []
  conventions:
    naming:
      pattern: 動詞 (+ 目的語) で機能を表す。何をする振る舞いか一読で分かるようにする。受動態は避ける。
      examples:
        good:
        - 取引データをCSVから一括インポートする
        - アップロードデータをリアルタイム検証する
        - 多段階承認を処理する
        - 通信データを暗号化する
      severity: warning
    rules:
    - id: RUL_f0a7
      title: モデルレビューで整合性を確認する
      statement: 要求-設計-振る舞い-検証の各レイヤ間で、未接続要素・矛盾・重複が無いか定期的に確認する。生成直後と統合直後は必須。
      severity: info
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_9547
      title: ユースケースは Activity で詳細化する
      statement: 主要 UseCase は refine 関係で Activity と接続し、シナリオを詳細化する。テキスト記述のみのユースケースは検証困難。
      severity: info
    - id: RUL_91c1
      title: 振る舞いは実行主体へ allocate で割り当てる
      statement: 主要な Activity は allocate 関係で実行主体の Block (Subsystem/Component) に割り当てる。割当が無い機能は実装責任が曖昧。
      severity: warning
    - id: RUL_f793
      title: 要求は設計要素または振る舞いへ追跡可能にする
      statement: 主要要求は satisfy / refine / trace の少なくとも一つで下流成果物 (Block, Activity, UseCase) と接続する。孤立した要求を残さない。
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_008
- className: State
  id: 0c4b4bb0-de0c-44f6-8a13-7c675dae69fb
  name: 状態
  description: ブロックや取引データ、承認ワークフローが取りうる動作モード・内部状態（例：インポート中、承認待ち、承認済、差し戻し中など）。
  stateType: normal
  stereotypes: []
  conventions:
    naming:
      pattern: 形容詞 / 動名詞 / 名詞で状態を表す。'〜中' '〜状態' '〜済' 等で完了/進行/結果を区別する。
      examples:
        good:
        - インポート処理中
        - 一時承認待ち
        - 最終承認済
        - エラー検知状態
      severity: warning
    rules:
    - id: RUL_7ce5
      title: 状態遷移は初期状態と最終状態を含める
      statement: State Machine を作成する場合は stateType=initial の状態を 1 つ用意する。終了する振る舞いには stateType=final を含める。
      severity: info
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_009
- className: TestCase
  id: 7bf4480b-d140-4ed3-8b69-176e23aa1923
  name: テストケース
  description: 要求（リアルタイムチェック、インポート、暗号化通信等）を検証するための試験観点・手順・合否基準。
  preConditions: []
  expectedResults: []
  postConditions: []
  stereotypes: []
  conventions:
    naming:
      pattern: 『検証対象 + 観点』または『要求ID + 検証内容』。何を検証するテストか一意に分かる名前にする。
      examples:
        good:
        - BR-01 取引データ一括インポート検証
        - BR-02 CSVリアルタイムバリデーションテスト
        - HTTPS通信暗号化監査テスト
      severity: warning
    rules:
    - id: RUL_f0a7
      title: モデルレビューで整合性を確認する
      statement: 要求-設計-振る舞い-検証の各レイヤ間で、未接続要素・矛盾・重複が無いか定期的に確認する。生成直後と統合直後は必須。
      severity: info
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_daf5
      title: テストケースには合否基準と前提条件を記述する
      statement: TestCase は objective, preConditions, expectedResults を必ず記述。expectedResults 欠落のテストは合否判定不能。
      severity: warning
    - id: RUL_ac8b
      title: 要求は必ずテストケースで検証する
      statement: priority=must/Must の要求は少なくとも 1 つの TestCase と verify 関係で接続する。verify の無い must 要求はカバレッジ不足。
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_010
- className: Operation
  id: 41ccc932-ea8b-41ae-8adb-623237a473b3
  name: 操作
  description: ブロックが提供する操作・メソッド・サービス（API連携メソッド、暗号化処理、インポート処理等）。
  stereotypes: []
  conventions:
    naming:
      pattern: 動詞 (+ 目的語) の camelCase。Getter は get*, Setter は set*, 状態確認 is*/has*。
      examples:
        good:
        - importCsvData
        - validateFields
        - approveStep
        - encryptPayload
      severity: warning
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_012
- className: Package
  id: b05b09b9-37a4-4af2-8fb3-5b1cd7a4b9bb
  name: Package 共通規約
  isReferenceModel: false
  conventions:
    naming:
      pattern: 観点 (viewpoint) または開発フェーズを考慮した分類名。同じプロジェクト内で命名スタイルを統一する。
      examples:
        good:
        - フェーズ1コア要求
        - 既存基幹システム接続物理アーキテクチャ
        - 将来フェーズバックログ
      severity: warning
    rules:
    - id: RUL_da33
      title: ビジネス要件のフェージング（スコープ外）制御
      statement: AIエラー予測、モバイルネイティブアプリ等の将来展望項目（スコープ外）は、今回の開発フェーズパッケージ（フェーズ1）からは除外し、バックログまたは将来フェーズパッケージ（フェーズ2）に明確に隔離してモデリングすること。
      severity: warning
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_49b0
      title: モデルは観点ごとにパッケージで整理する
      statement: 要求 / 構造 / 振る舞い / ユースケース / 検証 を別々のパッケージ (viewpoint) に分けて整理する。1 パッケージに混在させない。
      severity: info
    - id: RUL_fd37
      title: 分解階層は 3 段までを目安とする
      statement: System → Subsystem → Component の 3 段が標準。それ以上は粒度過剰の可能性。例外はパッケージで観点を分けて整理する。
      severity: info
- className: Package
  id: bc4291c3-b7ff-4827-84d9-7e3a2e91fa14
  name: パッケージ
  description: モデル要素を観点やビジネス目標、システム開発フェーズ（フェーズ1、フェーズ2など）ごとに整理するコンテナ。
  isReferenceModel: false
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_014
- className: Package
  id: 8d394dde-5d53-4550-9872-d2f94ae3b1bf
  name: 用語
  isReferenceModel: false
- className: Package
  id: a527e7c4-89f3-4015-a9f2-0b13fca19936
  name: Block 共通規約
  isReferenceModel: false
  conventions:
    naming:
      pattern: 名詞句で役割・対象を表す。階層に応じた粒度 (System=全体, Subsystem=機能領域, Component=モジュール)。
      examples:
        good:
        - バッテリー取引管理システム
        - ワークフロー管理サブシステム
        - 既存社内基幹システム
        - CSVデータ検証コンポーネント
      severity: warning
    rules:
    - id: RUL_d0fe
      title: API連携および外部通信時のセキュリティ暗号化規約
      statement: 既存社内基幹システムなどの外部API接続やデータ通信を伴う接続ポート/インターフェースは、必ず暗号化（HTTPS等）制約要件（BR-05/セキュリティポリシー）を satisfy すること。
      severity: error
    - id: RUL_f0a7
      title: モデルレビューで整合性を確認する
      statement: 要求-設計-振る舞い-検証の各レイヤ間で、未接続要素・矛盾・重複が無いか定期的に確認する。生成直後と統合直後は必須。
      severity: info
    - id: RUL_6b65
      title: 命名は ElementType ごとの規約に従う
      statement: Block は名詞句、Activity は動詞句、Requirement は『〜すること』、UseCase はアクター視点の価値表現で命名する (NamingConventions 参照)。
      severity: info
    - id: RUL_91c1
      title: 振る舞いは実行主体へ allocate で割り当てる
      statement: 主要な Activity は allocate 関係で実行主体の Block (Subsystem/Component) に割り当てる。割当が無い機能は実装責任が曖昧。
      severity: warning
    - id: RUL_fd37
      title: 分解階層は 3 段までを目安とする
      statement: System → Subsystem → Component の 3 段が標準。それ以上は粒度過剰の可能性。例外はパッケージで観点を分けて整理する。
      severity: info
    - id: RUL_bfd8
      title: 構造分解は責務が重複しない粒度で行う
      statement: System / Subsystem / Component の各階層で、子ブロック間の責務 (responsibility) が重複しないようにする。重複は再分解の合図。
      severity: warning
    - id: RUL_f793
      title: 要求は設計要素または振る舞いへ追跡可能にする
      statement: 主要要求は satisfy / refine / trace の少なくとも一つで下流成果物 (Block, Activity, UseCase) と接続する。孤立した要求を残さない。
      severity: warning
- className: Block
  id: 94fd7daa-9467-4c71-b053-f429483c5237
  name: システム
  description: 検討対象となるシステム全体 (System-of-Interest)。境界の最上位ブロックで、外部アクター/外部システムと接する。1モデルにつき原則1つ。
  stereotypes: []
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_001
- className: Block
  id: 786666b6-a9d2-445b-9f91-850c693aa2b9
  name: サブシステム
  description: システムを責務単位で分解した中間構造。複数のコンポーネントを束ねる。階層モデリングの中間層として使用。
  stereotypes: []
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_002
- className: Block
  id: 27f34559-8861-474b-a96d-dbabf95ec98c
  name: コンポーネント
  description: サブシステムを構成する最小の構造単位 (HW/SW モジュール、ECU、サービスなど)。さらに分解しない実装単位。
  stereotypes: []
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: CLS_003
- className: Block
  id: 97551697-8501-4923-959a-15a90c896cc8
  name: MBSE
  description: Model-Based Systems Engineering。モデルを中心に要求・設計・検証を統合するシステムズエンジニアリング手法。
  stereotypes:
  - term
  conventions:
    synonyms:
    - Model-Based Systems Engineering
    - モデルベースシステムズエンジニアリング
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: TERM.MBSE
- className: Block
  id: c8be69c6-a527-4969-92f7-136fdf527862
  name: SysML
  description: Systems Modeling Language。MBSE のためのモデリング言語。UML をベースに要求・パラメトリック制約を追加した OMG 標準。
  stereotypes:
  - term
  conventions:
    synonyms:
    - Systems Modeling Language
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: TERM.SysML
- className: Block
  id: 75b73aec-45a7-4bf1-b4c7-24137b1c2868
  name: トレーサビリティ
  description: 要求・設計・振る舞い・検証成果物の対応関係を双方向に追跡できる性質。satisfy / verify / trace / deriveReqt / allocate などの関係で実現する。
  stereotypes:
  - term
  conventions:
    synonyms:
    - traceability
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: TERM.トレーサビリティ
- className: Block
  id: b32a6aa6-0b78-4ab3-a7d1-9385c5b928d2
  name: 機能割当
  description: 振る舞いモデル (Activity) で定義した機能を、実行主体となる構造要素 (Block) へ allocate 関係で対応付けること。
  stereotypes:
  - term
  conventions:
    synonyms:
    - allocation
    - functional allocation
  metaData:
    version: 1.0
    createdBy: null
    createdDate: null
    ref: TERM.機能割当
- className: Block
  id: 42109d5b-55f3-4e1f-941b-57b8707f5115
  name: 構成分解
  description: システムを階層的なブロックへ分割し、責務と境界を明確化する活動。System → Subsystem → Component の階層を作る。
  stereotypes:
  - term
  conventions:
    synonyms:
    - decomposition
