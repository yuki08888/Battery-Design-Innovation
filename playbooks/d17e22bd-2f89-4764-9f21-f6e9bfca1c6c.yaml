id: ""
name: 既存コードからのモデル化
slash_command: code-reverse
description: 既存のソースコードの構造 (モジュール・クラス・公開メソッド・継承・依存) を読み、承認を得てから SysML 要素の作成を builtin:model に委任し、作成された要素とシンボルをリンクする
use_when: 既存コードをモデル化 (リバースエンジニアリング) するよう依頼された場合
steps:
  - no: 1
    title: 対象範囲の確定と構造の読み取り
    instruction: |
      コードドメイン(code)で実行する。横断エージェントならbuiltin:codeへ委任する。
      対象のコードプロジェクトとディレクトリを確定する(曖昧ならask_userで確認する)。
      list_dir/file_searchでファイルを洗い出し、ファイルごとにget_document_symbolsでモジュール・クラス・公開メソッド・継承を読む。
      依存(import・呼び出し)はgrep_code/find_referencesで確かめる。テスト・生成物・vendor は対象から外す。
      find_unlinkedで既にモデルへリンク済みのシンボルを除き、二重にモデル化しない。
    tools: [list_code_workspaces, select_code_workspace, list_dir, file_search, get_document_symbols, grep_code, find_references, find_unlinked, ask_user]
    done_when: 対象ファイルの一覧と、各ファイルのクラス・公開メソッドの件数、リンク済みで除外したシンボルが記録されている
  - no: 2
    title: モデル化の提案と承認
    instruction: |
      構造を SysML に対応づける: モジュール/パッケージ → Package、クラス → Block、公開メソッド → Operation、継承 → generalization、依存 → 関係(dependency など)。
      既存のモデル要素と同じものがあればtrace_code_to_model/get_code_contextで確かめ、新規作成ではなくリンクで済ませる。
      提案を表(コードのシンボル / 作る要素の種類と名前 / 親 / 関係 / 既存要素との対応)にしてask_userで承認を得る。承認されなかった行は作らない。
    tools: [trace_code_to_model, get_code_context, ask_user]
    done_when: 提案した要素の一覧と、承認・却下された行の件数が記録されている
  - no: 3
    title: モデル要素の作成 (委任) とリンク
    instruction: |
      承認された行だけをdelegateでbuiltin:modelに作成依頼する(コードドメインからモデルは変更しない)。依頼には既存要素の重複確認を含め、作成された要素の ID を返してもらう。
      返ってきた要素とシンボルを、抽象化の元になったシンボルへピンポイントでリンクする。
      対応表 (シンボル → 要素 ID) を links に、モデル化しなかったシンボルを exemptions に入れてlink_code_batchの 1 回で登録する
      (対応が曖昧ならsuggest_code_linksで候補を確かめる。link_code_to_element を場所ごとに繰り返さない)
      (紐づけの規則に従う: クラス → Block / 公開メソッド → 操作 は implements、引数・属性はそれを表す要素へ)。
      モデル化しなかったシンボル(却下された行・内部の補助関数など)はset_code_link_exemptionで理由を残す。
      check_code_link_coverageで対象ファイルの未リンクが 0件(リンクか対象外の理由)になったことを確かめ、
      check_design_consistencyで作った要素とコードの名前・型・引数が一致していることを確かめる。
      作成した要素・張ったリンク・対象外にしたシンボルと理由・作れなかった行を報告する。
    tools: [link_code_batch, suggest_code_links, link_code_to_element, trace_code_to_model, get_document_symbols, check_code_link_coverage, set_code_link_exemption, check_design_consistency]
    done_when: 作成された要素 ID と対応シンボルの一覧、張ったリンクの件数、対象外の理由、未リンク 0件、作れなかった行の有無が記録されている
