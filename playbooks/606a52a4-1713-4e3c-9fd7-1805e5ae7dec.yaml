id: ''
name: 検証計画（SysMLオントロジー.yaml）
slash_command: migrated-verificationplanning
description: 'オントロジー「SysMLオントロジー.yaml」の v2 → v3 移行により自動生成された手順書です。

  旧 ModelingRules の Procedure="VerificationPlanning" に該当する 2 件の規約を手順として書き起こしています。


  注意:

  - 各ステップの内容は規約の文面をそのまま転記したものです。実際の作業手順として読めるように整理してください。

  - 同じ内容はオントロジー側の規約 (conventions.rules) にも設定されています。'
use_when: 検証計画に関する作業を行うとき。
steps:
- 'no': 1
  title: 要求は必ずテストケースで検証する
  instruction: priority=must/Must の要求は少なくとも 1 つの TestCase と verify 関係で接続する。verify
    の無い must 要求はカバレッジ不足。
  tools: []
  done_when: ''
- 'no': 2
  title: テストケースには合否基準と前提条件を記述する
  instruction: TestCase は objective, preConditions, expectedResults を必ず記述。expectedResults
    欠落のテストは合否判定不能。
  tools: []
  done_when: ''
strict: false
allow_skip: true
max_steps_per_stage: 12
