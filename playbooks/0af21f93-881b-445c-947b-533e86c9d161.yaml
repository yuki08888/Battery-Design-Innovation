id: ''
name: 要求分析（SysMLオントロジー.yaml）
slash_command: migrated-requirementsanalysis
description: 'オントロジー「SysMLオントロジー.yaml」の v2 → v3 移行により自動生成された手順書です。

  旧 ModelingRules の Procedure="RequirementsAnalysis" に該当する 3 件の規約を手順として書き起こしています。


  注意:

  - 各ステップの内容は規約の文面をそのまま転記したものです。実際の作業手順として読めるように整理してください。

  - 同じ内容はオントロジー側の規約 (conventions.rules) にも設定されています。'
use_when: 要求分析に関する作業を行うとき。
steps:
- 'no': 1
  title: 要求は検証可能な単一文で記述する
  instruction: Requirement の text は『〜すること』形式の単一要求とし、'適切な'/'十分な'/'なるべく' 等の曖昧語を使わない。複合要求は分割する。
  tools: []
  done_when: ''
- 'no': 2
  title: 要求には優先度と検証方法を必ず付与する
  instruction: priority (must/should/may、またはMust/Want) と verificationMethod を欠落させない。
  tools: []
  done_when: ''
- 'no': 3
  title: ビジネス要件のフェージング（スコープ外）制御
  instruction: AIエラー予測、モバイルネイティブアプリ等の将来展望項目（スコープ外）は、今回の開発フェーズパッケージ（フェーズ1）からは除外し、バックログまたは将来フェーズパッケージ（フェーズ2）に明確に隔離してモデリングすること。
  tools: []
  done_when: ''
strict: false
allow_skip: true
max_steps_per_stage: 12
