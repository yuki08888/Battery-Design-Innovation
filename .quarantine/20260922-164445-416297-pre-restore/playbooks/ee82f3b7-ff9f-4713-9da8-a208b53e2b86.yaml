id: ""
name: 構想からモデルへ（アイデアの段階的具体化）
slash_command: ideate
description: |
  漠然としたアイデアや考えを、AI とのキャッチボールでブラッシュアップし、
  イメージ（画像 / 概念図）で認識を合わせたうえで、合意した部分だけを
  SysML モデルとオントロジー（メタモデル）へ段階的に落とし込む手順。
  構想エージェント（builtin:ideation）での利用を想定する。
use_when: |
  ユーザーが「まだ漠然としているが○○を作りたい」「アイデアを整理したい」
  「頭の中のイメージを形にしたい」等、要件や構造が固まっていない段階で依頼したとき。
steps:
  - no: 1
    title: 探索 — 対象とゴールの言語化
    instruction: |
      ユーザーの言葉から「何を / 誰のために / なぜ / 何が達成できたら成功か」を拾い、
      不足している点を最大 3 つの問い（選択肢付き）で確認する。
      既存モデルに関連する要素があれば search_item で確認し、ボードの concepts に候補として載せる。
      update_idea_board で theme / goal / stage=explore / openQuestions を記録して、問いで終える。
    tools:
      - update_idea_board
      - search_item
      - search_terminology
    done_when: 構想ボードに theme と goal が記録され、未確定事項が openQuestions として一覧化されている（0件の場合も含む）
  - no: 2
    title: 発散 — 構成要素・利用者・制約の洗い出し
    instruction: |
      対象を構成する要素、利用者、外部環境、制約、成功条件を幅広く挙げる。
      ユーザーの回答に含まれる新しい着眼点は捨てず、すべて concepts（status: candidate）に登録する。
      オントロジーに対応概念があれば search_ontology_concepts で kind（SysML 種別）の候補を確認する。
    tools:
      - update_idea_board
      - search_ontology_concepts
      - read_ontology_concept
    done_when: 概念候補が各カテゴリ（構成要素 / 利用者 / 制約 / 成功条件）について一覧化され、全候補に kind の仮置きがある
  - no: 3
    title: 収束 — 重要度の合意
    instruction: |
      候補を「必ず必要 / あると良い / 今回は対象外」に分け、ユーザーに確認する。
      合意したものは status: agreed、外すものは dropped にし、decisions に「何を / なぜ」を残す。
    tools:
      - update_idea_board
    done_when: 全概念候補の status が agreed / dropped のいずれかに分類され、各判断の理由が decisions に記録されている
  - no: 4
    title: 可視化 — イメージで認識を合わせる
    instruction: |
      合意した概念とその関係から generate_concept_image でイメージを生成し、
      「これで合っていますか？ 違うところはどこですか？」と確認する。
      画像生成が使えない場合は回答本文の visual-graph フェンスで概念関係図を描く。
      フィードバックを concepts / relations に反映する。
    tools:
      - generate_concept_image
      - update_idea_board
    done_when: イメージ（画像 assetId または visual-graph）が 1 件以上存在し、ユーザーの確認結果が decisions に記録されている
  - no: 5
    title: 構造提案 — SysML 構造と「なぜ」の説明
    instruction: |
      agreed な概念に対し SysML 要素種別（Block / Requirement / UseCase / Actor / Activity / Property 等）と
      関係（composition / association / satisfy 等）を提案する。
      必ず「なぜその構造にしたか」（別案・選ばなかった理由・前提）を述べ、ユーザーの合意を得る。
      合意内容は decisions に記録し、stage=structure にする。
    tools:
      - update_idea_board
      - read_ontology_concept
      - explain_applicable_conventions
    done_when: 全 agreed 概念に kind と配置先の提案があり、構造選択の理由が decisions に記録され、ユーザーの合意が得られている
  - no: 6
    title: モデル化 — 合意した要素の作成
    instruction: |
      既存モデルを read_package_contents で確認して重複を避け、
      create_multi_elements で合意した要素と関係を作成する。
      作成した要素の短縮IDを update_idea_board の concepts[].elementId / status: modeled に反映し、
      生成済みイメージがあれば place_image_on_diagram で図に配置して根拠要素へ紐づける。
      最後に validate_model を 1 回実行する。
    tools:
      - read_package_contents
      - create_multi_elements
      - create_relationship
      - create_free_diagram
      - place_image_on_diagram
      - update_idea_board
      - validate_model
    done_when: 全 agreed 概念がモデル要素として存在し elementId が記録され、validate_model が error 0件、または残る各違反の理由を記録した
    referenceConventions:
      - Block
      - Requirement
      - Package
  - no: 7
    title: オントロジー化 — 概念をメタモデルとして残す
    instruction: |
      安定した概念と概念間関係を propose_ontology_concepts で新しいオントロジーに起こし、
      作成済みモデル要素を elementIds でインスタンスとしてリンクする。
      回答では概念ごとに「定義」と「なぜ独立した概念にしたか」を述べ、stage=done にする。
    tools:
      - propose_ontology_concepts
      - update_idea_board
    done_when: オントロジーが作成され、全 modeled 概念が概念要素として存在し、モデル要素とのリンク件数が記録されている
strict: false
allow_skip: true
max_steps_per_stage: 12
