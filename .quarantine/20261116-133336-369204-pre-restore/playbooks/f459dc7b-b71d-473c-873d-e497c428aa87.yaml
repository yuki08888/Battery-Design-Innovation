id: ""
name: モデルに照らしたコードレビュー
slash_command: code-review
description: コードの変更 (git diff) をリンク先の要求・インターフェース・制約と突き合わせてレビューし、違反の候補を行番号付きで報告する (編集しない)
use_when: コードの変更・ブランチをモデル (仕様) に照らしてレビューするよう依頼された場合。読み取り専用の Agent でも実行できる
steps:
  - no: 1
    title: 変更範囲の把握
    instruction: |
      コードドメイン(code)で実行する。この手順書ではファイルを編集しない。
      code_git_statusとcode_git_diffで変更されたファイルと差分を読む(コミット範囲の指定があればcode_git_logで確かめる)。
      変更されたシンボルをget_document_symbolsで特定する。
    tools: [list_code_workspaces, select_code_workspace, code_git_status, code_git_diff, code_git_log, get_document_symbols]
    done_when: 変更ファイルと変更シンボルの一覧が記録されている
  - no: 2
    title: 仕様との突き合わせ
    instruction: |
      変更シンボルごとにtrace_code_to_modelでリンク先の要素を調べ、get_code_contextで要求・I/F(ポート・操作・型)・制約を読む。
      仕様と照らして、要求の未充足・I/F の名前や型の不一致・制約(値の範囲・単位)違反・エラー処理の欠落を探す。
      呼び出し元への影響はfind_referencesで、型はget_type_infoで確かめる。get_diagnosticsのエラーも拾う。
      リンクの無い変更シンボルはfind_unlinkedで洗い出し、仕様との対応が無いことを指摘する。
    tools: [trace_code_to_model, get_code_context, read_code_file, find_references, get_type_info, get_diagnostics, find_unlinked]
    done_when: 各変更シンボルのリンク先要素 ID と、照合した要求・I/F の一覧が記録されている
  - no: 3
    title: レビュー結果の報告
    instruction: |
      指摘を表にする: ファイルと行番号 / 種類(要求の未充足・I/F の不一致・制約違反・リンクなし・診断エラー) / 根拠となる要素 / 修正案。
      確信の低い指摘は「候補」と明記する。指摘が無い観点も「問題なし」として挙げる。
    tools: [read_code_file]
    done_when: 指摘の一覧 (行番号・種類・根拠の要素) と、観点ごとの指摘の件数が記録されている
