id: ""
name: モデルからのコード実装
slash_command: code-implement
description: SysML モデル (要求・ユースケース・Block・I/F) を仕様としてコードを実装し、診断とテストで確かめてから実装シンボルをモデル要素へリンクする
use_when: モデル要素 (Block / 要求 / ユースケース / 操作) をコードとして実装・追加実装するよう依頼された場合。小さな修正では必要な段階だけ実施する
steps:
  - no: 1
    title: 仕様と既存リンクの把握
    instruction: |
      コードドメイン(code)で実行する。横断エージェントならbuiltin:codeへ委任する。
      対象のコードプロジェクトをlist_code_workspaces/select_code_workspaceで確定する(複数あり決められないときはask_user)。
      実装する要素ごとにget_code_contextで仕様(属性・操作・ポート・関係・要求・ユースケースのフロー)と既存のリンク・関連コードを読む。
      要求を満たす Block、ユースケースを実現する Block など、関係を辿って仕様の範囲を確定する(trace_element_to_code で既に実装済みの箇所も確かめる)。
      仕様が曖昧・矛盾しているときは推測で実装せずask_userで確認する。モデルを直す必要があるなら builtin:model へ委任する(コードからは変更しない)。
    tools: [list_code_workspaces, select_code_workspace, get_code_context, trace_element_to_code, ask_user]
    done_when: 実装対象の要素 ID・満たすべき要求の一覧・既存リンクの有無が記録されている
  - no: 2
    title: 既存の実装と規約の調査
    instruction: |
      書く前に既存コードの構成・命名・エラー処理・テストの書き方をgrep_code/file_search/find_symbol/get_document_symbolsで調べ、同じ流儀に合わせる。
      似た処理が既にあれば再利用する(重複実装しない)。呼び出し元・影響範囲はfind_referencesで確かめる。
      ユースケースのフロー(ステップ)は関数の分割単位として使う。ステップごとに関数(またはメソッド)を割り当てる対応表を作る。
    tools: [grep_code, file_search, read_code_file, find_symbol, get_document_symbols, find_references, semantic_search]
    done_when: 変更・追加するファイルの一覧、参考にした既存シンボル、ユースケースのステップと関数の対応表が記録されている
  - no: 3
    title: 実装計画
    instruction: |
      create_planで計画を立てる: 変更するファイル、公開するインターフェース(関数・クラス・引数・戻り値)、要求ごとの実現箇所、作るテスト。
      I/F は モデルのポート・操作・型と名前と型を一致させる。モデルに無い I/F を勝手に足さない(必要ならユーザーに確認する)。
    tools: [read_code_file, get_type_info, go_to_definition]
    done_when: 計画に各要求の実現箇所と変更ファイルの一覧が記録されている
  - no: 4
    title: 実装と診断
    instruction: |
      計画に沿って実装する。既存ファイルはreplace_string_in_code/multi_replace_string_in_codeで必要な箇所だけ変更し、全体を書き直さない。
      新規ファイルはcreate_code_fileで作る。削除・移動(delete_code_path/rename_code_path)は承認が要るので本当に必要なときだけ使う。
      編集のたびにget_diagnosticsで確かめ、エラーが 0件になるまで直す。
    tools: [replace_string_in_code, multi_replace_string_in_code, create_code_file, create_code_directory, rename_code_path, delete_code_path, get_diagnostics]
    done_when: 変更したファイルの一覧と、その全ファイルの診断エラーが 0件であることが記録されている
  - no: 5
    title: テストの作成と実行
    instruction: |
      要求ごとに、その要求を検証するテストケース (get_code_context の testCases) の期待結果を確かめるテストを既存のテストの流儀で書く(テストの場所・命名・フレームワークは手順 2 の調査に合わせる)。
      テストケースが無い要求は、delegateでbuiltin:modelにテストケースと要求への verify 関係の作成を依頼する(自分ではモデルを変えない)。
      run_code_testsで実行する(承認が要る)。ライブラリが足りなければget_python_envで確かめ、request_python_packagesで理由を添えて承認を依頼する。
      失敗したら原因を直して再実行する。直せないときは失敗の内容をそのまま報告する(テストを弱めて通さない)。
    tools: [create_code_file, replace_string_in_code, run_code_tests, get_code_command_output, get_python_env, request_python_packages]
    done_when: 作ったテストの一覧と実行結果 (成功・失敗の件数) が記録されている
  - no: 6
    title: モデルとのリンク (原則すべて)
    instruction: |
      実装したシンボルは原則すべて要素へリンクする。まずsuggest_code_links(paths=変えたファイル)で候補を出し、
      確かめた suggestions を links に、対象外にするものを exemptions に入れてlink_code_batchの 1 回で登録する
      (link_code_to_element / set_code_link_exemption を場所ごとに繰り返さない。needsDecision は候補から選ぶ)。
      ファイル全体ではなく、対応するシンボルにピンポイントで張る
      (get_document_symbolsで正確なパスを確かめる。例: 関数 fn、引数 fn::x、ローカル変数 fn::total、DOM App::<button.primary>、CSS の宣言 .btn::color)。
      リンク先の種類とリンク種別は紐づけの規則に従う(Block / 操作 / ポートには implements、テストはその要求を検証するテストケースへ verifies、ユースケースのステップに対応する関数には traces)。
      要求へは直接リンクしない(実装は要求を satisfy する設計要素へ、テストはテストケースへ)。
      同じ親の中の兄弟シンボルを、ある時は Operation・ある時は Block のようにばらばらな種類へ張らない。
      既存リンクの位置がずれていればrelink_codeで直す。
      モデルに対応する要素が無い・リンクする意味が無いシンボル(内部の補助関数・生成コード等)は、set_code_link_exemptionで理由(8文字以上)を残す。
      check_code_link_coverageで未リンクが 0件(リンクか対象外の理由のどちらか)になるまで繰り返す。
    tools: [suggest_code_links, link_code_batch, link_code_to_element, relink_code, trace_code_to_model, find_unlinked, get_document_symbols, check_code_link_coverage, set_code_link_exemption, clear_code_link_exemption]
    done_when: 張ったリンクの件数、対象外にしたシンボルと理由、check_code_link_coverageの未リンク 0件が記録されている
  - no: 7
    title: 設計と実装の整合確認と報告
    instruction: |
      check_design_consistencyで、変更したファイルにリンクしている要素(属性・操作・ポート・要求の本文)と実装を突き合わせる。
      issues(名前・型・引数の不一致、リンク規則違反)は直す。コードが正しくモデルが古いならコードは変えず builtin:model への修正を報告・委任する。
      review の行は内容を読んで要求を満たしているか判断する。
      要求ごとに「どのファイルのどのシンボルで満たしたか」「どのテストで検証したか」を表で報告し、未実装・未検証の要求、対象外にしたシンボルと理由、残った不整合を明記する。
    tools: [check_design_consistency, get_code_context, read_code_file, replace_string_in_code, multi_replace_string_in_code, get_diagnostics, trace_code_to_model]
    done_when: check_design_consistencyの結果(不整合 0件、または残した理由)、各要求の充足シンボルと検証テストの一覧が記録されている
